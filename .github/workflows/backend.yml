name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-build-tests:
    name: Backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: securebrowser_db
          POSTGRES_USER: sbp_app
          # Credencial pública y desechable, exclusiva de la base de datos de CI.
          POSTGRES_PASSWORD: sbp_ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sbp_app -d securebrowser_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SBP_DB_URL: jdbc:postgresql://localhost:5432/securebrowser_db
      SBP_DB_USERNAME: sbp_app
      SBP_DB_PASSWORD: sbp_ci_test_password

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Las pruebas de la API de Company también arrancan su propio PostgreSQL.
      - name: Check Docker for Testcontainers
        run: docker info --format '{{.ServerVersion}}'

      - name: Build, test and package backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Verify Compose delivery and Postman after recreation
        working-directory: .
        env:
          SBP_HTTP_PORT: '8080'
        run: bash scripts/verify-compose.sh
