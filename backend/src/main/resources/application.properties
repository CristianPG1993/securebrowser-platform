# Nombre de la aplicación.
spring.application.name=securebrowser-backend

# Conexión a PostgreSQL mediante variables de entorno.
spring.datasource.url=${SBP_DB_URL}
spring.datasource.username=${SBP_DB_USERNAME}
spring.datasource.password=${SBP_DB_PASSWORD}

# Hibernate comprueba el esquema sin crearlo ni modificarlo.
spring.jpa.hibernate.ddl-auto=validate

# Evita mantener el contexto JPA abierto durante toda la petición HTTP.
spring.jpa.open-in-view=false

# Flyway gestiona las migraciones del esquema al arrancar.
spring.flyway.enabled=true

# Clave secreta en Base64, emisor y audiencia recibidos del entorno.
sbp.security.jwt.secret-base64=${SBP_JWT_SECRET_BASE64}
sbp.security.jwt.issuer=${SBP_JWT_ISSUER}
sbp.security.jwt.audience=${SBP_JWT_AUDIENCE}

# Duración máxima del JWT: 900 segundos si no se configura otro valor.
sbp.security.jwt.max-lifetime-seconds=${SBP_JWT_MAX_LIFETIME_SECONDS:900}
