# Configuración JWT del perfil default utilizado por las pruebas.

# Clave conocida de 32 bytes, exclusiva de las pruebas automatizadas.
sbp.security.jwt.secret-base64=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# Emisor y audiencia de los tokens utilizados por las pruebas.
sbp.security.jwt.issuer=sbp-test
sbp.security.jwt.audience=sbp-api-test

# Duración máxima de los JWT de prueba, en segundos.
sbp.security.jwt.max-lifetime-seconds=900
